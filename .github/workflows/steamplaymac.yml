name: SteamPlayMac

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: SteamPlayMac
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the dylib
        run: |
          make -j"$(sysctl -n hw.ncpu)"
          bash checks/run.sh

      - name: Package and verify the disk image
        run: |
          make dmg
          hdiutil verify out/SteamPlayMac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SteamPlayMac
          path: SteamPlayMac/out/SteamPlayMac.dmg
          if-no-files-found: error
